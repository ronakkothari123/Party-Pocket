name: party_pocket
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.1+3

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  sensors_plus: ^6.1.1
  just_audio: ^0.9.42
  audio_session: ^0.1.21
  shared_preferences: ^2.3.4
  google_mobile_ads: ^5.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/content/
    - assets/music/
    - assets/images/
